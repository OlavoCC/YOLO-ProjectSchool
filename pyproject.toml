[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pothole-detector"
version = "1.0.0"
description = "YOLOv8-based pothole detection for municipal use"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
    "pyyaml>=5.3.1",
    "pillow>=7.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
train = "scripts.train.train:main"
predict = "scripts.inference.predict:main"
convert = "scripts.data.convert_voc_to_yolo:main"
add_negatives = "scripts.data.add_negatives:main"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]